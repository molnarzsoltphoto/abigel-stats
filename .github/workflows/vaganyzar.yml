name: Vágányzár gyűjtő (6 óránként)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: vaganyzar
  cancel-in-progress: false

jobs:
  gyujt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Letöltés és feldolgozás
        run: python scraper_vaganyzar.py
      - name: Commit
        run: |
          git config user.name "abigel-bot"
          git config user.email "abigel-bot@users.noreply.github.com"
          git add data/vaganyzar.json
          git diff --staged --quiet || git commit -m "Vágányzár – $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q || true
          git push
